<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign in - Nocturnal</title>
  <meta name="description" content="Sign in to Nocturnal AI Assistant"/>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap"
    rel="stylesheet"
  />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none'%3E%3Crect width='100' height='100' rx='22' fill='%23000000'/%3E%3Cpath stroke='%2300FF66' stroke-width='4' stroke-linecap='round' d='M35,8 C10,22 18,42 48,49'/%3E%3Cpath stroke='%2300FF66' stroke-width='4' stroke-linecap='round' d='M65,8 C90,22 82,42 52,49'/%3E%3Cpath stroke='%2300FF66' stroke-width='4' stroke-linecap='round' d='M35,92 C10,78 18,58 48,51'/%3E%3Cpath stroke='%2300FF66' stroke-width='4' stroke-linecap='round' d='M65,92 C90,78 82,58 52,51'/%3E%3Ccircle cx='50' cy='50' r='4' fill='%2300FF66'/%3E%3C/svg%3E">

  <style>
    /* ── Reset ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design tokens — identical to main app ──────────────── */
    :root {
      --bg:           #000000;
      --surface:      #050505;
      --border:       rgba(255,255,255,0.09);
      --border-focus: rgba(0, 255, 102,0.45);
      --accent:       #00FF66;
      --accent-dim:   rgba(0, 255, 102,0.15);
      --accent-glow:  rgba(0, 255, 102,0.35);
      --text:         #ffffff;
      --text-muted:   #b0b0b0;
      --input-bg:     #0a0a0a;
      --error:        #ff6b6b;
      --error-bg:     rgba(255,107,107,0.08);
      --success:      #3ee68b;
      --success-bg:   rgba(62,230,139,0.08);
      --font-ui:      'Syne', sans-serif;
      --font-body:    'DM Sans', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* Noise overlay — same as main app */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0; opacity: 0.4;
    }

    /* Ambient radial glow */
    .auth-glow {
      position: fixed; top: -10%; left: 50%; transform: translateX(-50%);
      width: 700px; height: 560px;
      background: radial-gradient(ellipse at center,
        rgba(0, 255, 102,0.10) 0%,
        rgba(0, 255, 102,0.06) 45%,
        transparent 70%);
      pointer-events: none; z-index: 0;
    }

    /* Centering wrapper */
    #auth-container {
      position: relative; z-index: 1;
      display: flex; align-items: center; justify-content: center;
      min-height: 100%; padding: 24px;
    }

    /* Auth card */
    #auth-card {
      width: 100%; max-width: 400px;
      background: rgba(19,20,26,0.9);
      border: 1px solid var(--border);
      border-radius: 26px; padding: 42px 38px 38px;
      backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03),
        0 24px 80px rgba(0,0,0,0.55),
        0 8px 24px rgba(0,0,0,0.3);
      animation: card-in 0.5s cubic-bezier(0.22,1,0.36,1) both;
    }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(22px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* VOID logo */
    .auth-logo-wrap { display: flex; justify-content: center; margin-bottom: 26px; }
    .auth-logo-wrap svg {
      width: 60px; height: 60px;
      filter: drop-shadow(0 0 18px rgba(165,180,252,0.28));
      animation: slow-spin 40s linear infinite;
    }
    @keyframes slow-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Header */
    .auth-header { text-align: center; margin-bottom: 30px; }
    #auth-title {
      font-family: var(--font-ui);
      font-size: 22px; font-weight: 700; color: var(--text);
      letter-spacing: -0.01em; margin-bottom: 5px;
    }
    .auth-sub { font-size: 13px; color: var(--text-muted); letter-spacing: 0.01em; }

    /* Feedback pills */
    .auth-msg {
      border-radius: 10px; padding: 10px 14px; font-size: 13px;
      line-height: 1.5; margin-bottom: 18px; display: none;
      animation: msg-in 0.25s ease both;
    }
    @keyframes msg-in {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .auth-msg.error   { background: var(--error-bg);   border: 1px solid rgba(255,107,107,0.18); color: var(--error); }
    .auth-msg.success { background: var(--success-bg); border: 1px solid rgba(62,230,139,0.18);  color: var(--success); }

    /* Form */
    #auth-form { display: flex; flex-direction: column; gap: 16px; }
    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-group label {
      font-size: 11px; font-family: var(--font-ui); font-weight: 600;
      color: var(--text-muted); letter-spacing: 0.07em; text-transform: uppercase;
    }
    .field-group input {
      background: var(--input-bg); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text);
      font-family: var(--font-body); font-size: 14.5px;
      padding: 12px 16px; outline: none; width: 100%;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field-group input::placeholder { color: var(--text-muted); }
    .field-group input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(0, 255, 102,0.1);
    }

    /* Submit button */
    #submit-btn {
      width: 100%; padding: 13px;
      background: var(--accent); border: none; border-radius: 14px;
      color: #fff; font-family: var(--font-ui); font-size: 14px;
      font-weight: 600; letter-spacing: 0.04em; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      gap: 8px; min-height: 48px; margin-top: 6px;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s, opacity 0.2s;
      box-shadow: 0 4px 18px rgba(0, 255, 102,0.35);
    }
    #submit-btn:hover:not(:disabled) {
      background: #00e65c; transform: translateY(-1px);
      box-shadow: 0 6px 26px rgba(0, 255, 102,0.5);
    }
    #submit-btn:active:not(:disabled) { transform: translateY(0); }
    #submit-btn:disabled { opacity: 0.55; cursor: default; transform: none; box-shadow: 0 2px 10px rgba(0, 255, 102,0.15); }

    /* Loading spinner */
    #btn-loader { display: none; gap: 4px; align-items: center; }
    #btn-loader span {
      width: 5px; height: 5px; background: rgba(255,255,255,0.85);
      border-radius: 50%; animation: dot-bounce 1.2s ease-in-out infinite;
    }
    #btn-loader span:nth-child(2) { animation-delay: 0.15s; }
    #btn-loader span:nth-child(3) { animation-delay: 0.30s; }
    @keyframes dot-bounce {
      0%,80%,100% { transform: translateY(0); opacity: 0.4; }
      40%          { transform: translateY(-5px); opacity: 1; }
    }

    /* Forgot password link */
    .forgot-wrap {
      display: flex; justify-content: flex-end;
      margin-top: 10px; font-size: 12.5px;
    }

    /* Resend verification block */
    .resend-wrap { display: none; text-align: center; margin-bottom: 16px; }

    /* Mode toggle */
    .toggle-wrap {
      display: flex; align-items: center; justify-content: center;
      gap: 6px; margin-top: 24px; font-size: 13px; color: var(--text-muted);
    }
    .link-btn {
      background: none; border: none; color: var(--accent);
      font-family: var(--font-body); font-size: 13px; cursor: pointer;
      padding: 0; text-decoration: underline; text-underline-offset: 2px;
      text-decoration-color: rgba(0, 255, 102,0.4); transition: color 0.18s;
    }
    .link-btn:hover { color: #00e65c; }

    @media (max-width: 480px) {
      #auth-card { padding: 32px 24px 28px; border-radius: 20px; }
    }
  </style>
</head>
<body>

  <div class="auth-glow" aria-hidden="true"></div>

  <div id="auth-container">
    <div id="auth-card">

      <!-- VOID logo — same SVG as main app header -->
      <div class="auth-logo-wrap">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path stroke="#00FF66" stroke-width="2.8" stroke-linecap="round" d="M35,8 C10,22 18,42 48,49"/>
          <path stroke="#00FF66" stroke-width="2.8" stroke-linecap="round" d="M65,8 C90,22 82,42 52,49"/>
          <path stroke="#00FF66" stroke-width="2.8" stroke-linecap="round" d="M35,92 C10,78 18,58 48,51"/>
          <path stroke="#00FF66" stroke-width="2.8" stroke-linecap="round" d="M65,92 C90,78 82,58 52,51"/>
          <path stroke="#00FF66" stroke-width="2.0" stroke-linecap="round" opacity="0.75" d="M8,38 C22,10 42,18 49,48"/>
          <path stroke="#00FF66" stroke-width="2.0" stroke-linecap="round" opacity="0.75" d="M8,62 C22,90 42,82 49,52"/>
          <path stroke="#00FF66" stroke-width="2.0" stroke-linecap="round" opacity="0.75" d="M92,38 C78,10 58,18 51,48"/>
          <path stroke="#00FF66" stroke-width="2.0" stroke-linecap="round" opacity="0.75" d="M92,62 C78,90 58,82 51,52"/>
          <circle cx="50" cy="50" r="3" fill="#00FF66"/>
        </svg>
      </div>

      <!-- Title/subtitle (updated by JS on mode switch) -->
      <div class="auth-header">
        <h1 id="auth-title">Sign in to Nocturnal</h1>
        <p class="auth-sub" id="auth-sub">Your AI companion awaits</p>
      </div>

      <!-- Feedback pills -->
      <div id="auth-error"   class="auth-msg error"   role="alert"  aria-live="polite"></div>
      <div id="auth-success" class="auth-msg success"  role="status" aria-live="polite"></div>

      <!-- Resend verification email (shown after sign-up, or after a
           "please verify your email" sign-in error) -->
      <div id="resend-wrap" class="resend-wrap">
        <button id="resend-link" class="link-btn" type="button">Resend verification email</button>
      </div>

      <!-- Auth form -->
      <form id="auth-form" novalidate>
        <div class="field-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email"
                 placeholder="you@example.com"
                 autocomplete="email" required />
        </div>
        <div class="field-group" id="password-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password"
                 placeholder="••••••••"
                 autocomplete="current-password" required />
        </div>
        <button type="submit" id="submit-btn" disabled>
          <span id="submit-label">Sign in</span>
          <span id="btn-loader" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
        </button>
      </form>

      <!-- Forgot password (sign-in mode only) -->
      <div class="forgot-wrap">
        <a href="#" id="forgot-link" class="link-btn">Forgot password?</a>
      </div>

      <!-- Sign in / Sign up toggle -->
      <div class="toggle-wrap">
        <span id="toggle-text">Don't have an account?</span>
        <button id="toggle-link" class="link-btn" type="button">Sign up</button>
      </div>

    </div>
  </div>

  <!-- Auth logic as ES module -->
  <script type="module" src="auth.js"></script>
</body>
</html>
